# Paths and endpoints are supplied for each capture, independently of skill location.
receivers:
  otlp:
    protocols:
      http:
        endpoint: ${env:CODEX_OTEL_HTTP_ENDPOINT:-127.0.0.1:4318}

processors:
  batch:
    timeout: 1s
    send_batch_size: 256

exporters:
  file/logs:
    path: ${env:CODEX_OTEL_CAPTURE_DIR}/logs.jsonl
    format: json
    append: true
    flush_interval: 1s
  file/traces:
    path: ${env:CODEX_OTEL_CAPTURE_DIR}/traces.jsonl
    format: json
    append: true
    flush_interval: 1s

extensions:
  health_check:
    endpoint: ${env:CODEX_OTEL_HEALTH_ENDPOINT:-127.0.0.1:13133}

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      level: none
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/logs]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/traces]
